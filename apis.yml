aid: kleiner-perkins
name: Kleiner Perkins
description: >-
  Kleiner Perkins is one of Silicon Valley's oldest and most storied venture
  capital firms, founded in 1972 by Eugene Kleiner and Tom Perkins and
  headquartered on Sand Hill Road in Menlo Park, California, with additional
  offices in San Francisco and Shanghai. Across more than five decades and 21
  venture funds plus 6 growth funds, the firm has invested over $10 billion and
  backed more than 900 ventures, including foundational companies such as Amazon,
  Google, Genentech, Electronic Arts, Juniper Networks, Intuit, Spotify, Figma,
  Robinhood, DoorDash, Duolingo and Databricks. Kleiner Perkins partners with
  founders from inception through IPO and beyond across early and growth stages,
  with seed rounds averaging roughly $4-5M and Series A rounds around $17-18M. In
  2026 the firm announced its twenty-second venture fund, KP22, a $1B early-stage
  fund, alongside $2.5B in new growth funds. Current investment focus centers on
  artificial intelligence and AI safety, enterprise software, developer tools and
  infrastructure, healthcare and biotech, fintech, hardtech and autonomous
  systems, and cybersecurity, with a thesis that the right idea, team and partners
  can create an entirely new industry.
